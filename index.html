<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMUSIC</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--g1:#8b5cf6;--g2:#f0abfc;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--mut:#9ca3af}
[data-theme=cyan]{--g1:#22d3ee;--g2:#34d399}
[data-theme=sunset]{--g1:#fb923c;--g2:#f43f5e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:#f5f5f7;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr auto;overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 50% at 15% 0%,color-mix(in srgb,var(--g1) 35%,transparent),transparent),radial-gradient(50% 40% at 100% 100%,color-mix(in srgb,var(--g2) 22%,transparent),transparent)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line)}
aside{grid-row:1;margin:12px 0 0 12px;border-radius:20px;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{font-weight:800;font-size:22px;letter-spacing:.04em;padding:0 10px 16px;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{text-align:left;padding:10px 12px;border-radius:12px;color:var(--mut);white-space:nowrap}
.nav.on,.nav:hover{background:var(--glass);color:#fff}
.themes{margin-top:auto;display:flex;gap:8px;padding:0 10px}
.themes button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none}
.themes button.on{border-color:#fff}
main{grid-row:1;overflow-y:auto;padding:24px 28px 40px;min-width:0}
.hide{display:none!important}
h2{font-size:18px;margin:22px 0 10px}
.search input{width:100%;padding:14px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line);outline:0}
.search input:focus{border-color:var(--g2)}
.tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tab.on{background:linear-gradient(90deg,var(--g1),var(--g2));color:#000;border-color:transparent;font-weight:600}
.sep{width:1px;background:var(--line);margin:0 4px}
.top{display:flex;gap:16px;align-items:center;padding:16px;border-radius:20px;max-width:520px;cursor:pointer}
.top img{width:96px;height:96px;border-radius:14px;object-fit:cover}
.top b{font-size:18px;display:block}
.row{display:grid;grid-template-columns:48px 1fr auto auto auto;gap:12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}
.row:hover,.row.cur{background:var(--glass)}
.row.cur b{color:var(--g2)}
.row img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#111}
.meta{min-width:0}.meta b,.meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span,.dur{color:var(--mut);font-size:12px}
.row button{width:32px;height:32px;border-radius:50%}
.row button:hover{background:var(--line)}
.msg{color:var(--mut);padding:24px 0}
.pl{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.head{display:flex;gap:10px;align-items:center;margin:8px 0}
.pill{padding:6px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
#player{grid-column:1/-1;margin:12px;border-radius:20px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:16px;align-items:center;z-index:5}
.np{display:flex;gap:12px;align-items:center;min-width:0}
.np img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#111;flex:none}
.ctl{display:flex;flex-direction:column;gap:4px;align-items:center}
.btns{display:flex;gap:6px;align-items:center}
.btns button{width:36px;height:36px;border-radius:50%;font-size:16px}
.btns button.on{color:var(--g2)}
.btns .pp{width:46px;height:46px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#000;font-size:18px}
.seek{display:flex;gap:8px;align-items:center;width:100%;font-size:11px;color:var(--mut)}
input[type=range]{accent-color:var(--g2);flex:1;min-width:0}
.right{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.right select{background:#111;border:1px solid var(--line);border-radius:8px;padding:4px}
.hq{font-size:10px;border:1px solid var(--g2);color:var(--g2);border-radius:6px;padding:2px 6px;white-space:nowrap}
#vol{max-width:90px}
dialog{margin:auto;background:#0b0b0f;color:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(340px,90vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog button.opt{display:block;width:100%;text-align:left;padding:10px;border-radius:10px}
dialog button.opt:hover{background:var(--glass)}
dialog input{width:100%;padding:10px;border-radius:10px;background:var(--glass);border:1px solid var(--line);margin:8px 0}
@media(max-width:820px){
 body{grid-template-columns:1fr}
 aside{flex-direction:row;margin:8px 8px 0;padding:8px;overflow-x:auto;align-items:center}
 .brand{padding:0 8px}.themes{margin:0 0 0 auto}
 main{padding:16px}
 #player{grid-template-columns:1fr;gap:8px;margin:8px}
 .right{justify-content:space-between}
 .row{grid-template-columns:44px 1fr auto auto}.row .dur{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== v2: touch, home shelves, immersive lyrics ===== */
html,body{-webkit-tap-highlight-color:transparent}
body{height:100vh;height:100dvh}
button,select,input[type=range],.card,.row,.np{touch-action:manipulation}
.np{cursor:pointer}
#yt{position:fixed;left:-9999px;bottom:0;width:1px;height:1px}
.nav,.tab,.pill,.chip,.row button,.btns button,.right button,.right select,dialog button.opt{min-height:44px;min-width:44px}
input{font-size:16px}
input[type=range]{height:44px}
.themes button{width:44px;height:44px;padding:9px;border:0;border-radius:50%;background-clip:content-box!important}
.themes button.on{filter:drop-shadow(0 0 5px #fff)}
.shelf{margin-right:-28px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:28px}
.chips{display:flex;gap:6px}
.chip{padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.chip.on{background:var(--glass);color:#fff;border-color:var(--g2)}
.scroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 28px 10px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.scroll::-webkit-scrollbar{display:none}
.card{flex:0 0 160px;scroll-snap-align:start;cursor:pointer;border-radius:18px;padding:8px;transition:all .3s ease;min-width:0}
.card:hover{background:var(--glass)}
.cv{position:relative}
.cv img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#111;display:block}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card b{margin-top:8px;font-size:13px}.card span{color:var(--mut);font-size:12px}
.rank{position:absolute;left:10px;bottom:6px;font:800 30px/1 system-ui;font-style:normal;text-shadow:0 2px 10px #000}
.tag{position:absolute;right:8px;top:8px;font-style:normal;font-size:10px;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.65)}
.scroll.qp{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);grid-auto-columns:min(300px,82%)}
.card.q{flex:none;display:flex;gap:12px;align-items:center;padding:6px}
.card.q .cv{width:52px;flex:none}.card.q b{margin:0}
#lyrView{position:fixed;inset:0 0 var(--ph,130px) 0;z-index:4;overflow:hidden;background:#000;display:flex;flex-direction:column}
#lyrBg{position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(50px) brightness(.5) saturate(1.5);transform:scale(1.15);transition:all .3s ease}
#lyrView::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(#000a,#0003 30%,#000a)}
.lhead{position:relative;z-index:1;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
#lyr{position:relative;z-index:1;flex:1;overflow-y:auto;padding:36vh 22px;text-align:center;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#lyr::-webkit-scrollbar{display:none}
#lyr p{font-size:clamp(26px,5.2vw,46px);line-height:1.2;font-weight:800;color:rgba(255,255,255,.3);padding:10px 0;transition:all .3s ease;cursor:pointer;filter:blur(1.2px)}
#lyr p.n2{color:rgba(255,255,255,.42)}
#lyr p.n1{color:rgba(255,255,255,.6);filter:none}
#lyr p.on{color:#fff;transform:scale(1.06);filter:none;text-shadow:0 0 28px color-mix(in srgb,var(--g2) 70%,transparent)}
#lyr p.none{font-size:16px;font-weight:600;filter:none;color:var(--mut);cursor:default}
@media(max-width:820px){
 .right{flex-wrap:wrap;gap:4px}#vol{max-width:none;flex:1 1 80px}
 .shelf{margin-right:-16px}.shead{padding-right:16px}.scroll{padding-right:16px}.card{flex-basis:140px}
}
@media(hover:none){.row:hover,.card:hover,.nav:hover{background:none}}
</style>
</head>
<body data-theme="purple">
<aside class="glass">
  <div class="brand">GMUSIC</div>
  <button class="nav on" data-v="search">Home</button>
  <button class="nav" data-v="library">Library</button>
  <button class="nav" data-v="history">Last session</button>
  <div class="themes" role="group" aria-label="Theme">
    <button data-t="purple" title="Cyberpunk Purple" style="background:linear-gradient(135deg,#8b5cf6,#f0abfc)"></button>
    <button data-t="cyan" title="Neon Cyan" style="background:linear-gradient(135deg,#22d3ee,#34d399)"></button>
    <button data-t="sunset" title="Sunset Orange" style="background:linear-gradient(135deg,#fb923c,#f43f5e)"></button>
  </div>
</aside>

<main>
  <section id="v-search">
    <div class="search"><input id="q" type="search" placeholder="Search songs, artists or albums" autocomplete="off"></div>
    <div class="tabs">
      <button class="tab on" data-src="ytmusic">YTMusic</button><button class="tab" data-src="youtube">YouTube</button>
      <span class="sep"></span>
      <button class="tab on" data-flt="songs">Songs</button><button class="tab" data-flt="videos">Videos</button><button class="tab" data-flt="albums">Albums</button>
    </div>
    <div id="home"></div><div id="res"></div>
  </section>
  <section id="v-library" class="hide"></section>
  <section id="v-history" class="hide"></section>
</main>

<div id="lyrView" class="hide"><div id="lyrBg"></div><div class="lhead"><button id="lyrClose" class="pill" aria-label="Close lyrics">⌄</button><div class="meta"><b id="lt"></b><span id="la"></span></div></div><div id="lyr"></div></div>
<div id="yt"></div>

<footer id="player" class="glass">
  <div class="np" id="np"><img id="art" alt=""><div class="meta"><b id="ttl">Nothing playing</b><span id="art-n">Search for a song to start</span></div></div>
  <div class="ctl">
    <div class="btns">
      <button id="shuf" title="Shuffle">⇄</button><button id="prev" title="Previous">⏮</button>
      <button id="pp" class="pp" title="Play/Pause">▶</button>
      <button id="next" title="Next">⏭</button><button id="rep" title="Repeat: off">↻</button>
    </div>
    <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek"><span id="tot">0:00</span></div>
  </div>
  <div class="right">
    <span class="hq" id="hq">High quality</span>
    <select id="spd" title="Playback speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select>
    <button id="mute" title="Mute">🔊</button><input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    <button id="lyrBtn" class="pill">Lyrics</button>
  </div>
</footer>

<dialog id="dlg"></dialog>

<script>
/* ============ CONFIG (edit here) ============
   YOUTUBE_API_KEY: optional. If set, search uses the YouTube Data API (most reliable).
   If empty, search and audio use the public Piped servers below (no key needed, but
   public servers can be slow or offline). Anyone who opens this file can read the key,
   so restrict it to YouTube Data API v3 in Google Cloud Console. */
const CONFIG = {
  YOUTUBE_API_KEY: 'AIzaSyCi08Lr5kNs5u5b6ZEUiQ_1ahEXIs2y_AI',
  REGION: 'ID',
  NOTIFICATION_ART: 'logo', // lock-screen artwork: 'logo' (GMUSIC) or 'track' (song thumbnail first)
  PIPED: ['https://pipedapi.kavin.rocks', 'https://api.piped.private.coffee', 'https://pipedapi.adminforge.de']
};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let pls = store.get('gm_playlists', {}), hist = store.get('gm_history', []);
const S = { bag: [], played: new Set(), userPaused: false, loading: false, us: 0, shelves: {}, queue: [], i: -1, view: [], shuffle: false, repeat: 0, src: 'ytmusic', flt: 'songs', lines: [], active: -1, seeking: false, openPl: null };

/* ============ DATA LAYER (replaces the old server) ============ */
const decode = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; };
const cleanTitle = s => decode(s).replace(/\s*[\(\[](official|lyrics?|audio|video|music video|hd|4k|visuali[sz]er)[^\)\]]*[\)\]]/gi, '').trim();
const cleanArtist = s => decode(s).replace(/ - Topic$/, '').replace(/VEVO$/i, '').trim();
const isoSec = iso => { const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(iso || ''); return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0; };
const cache = new Map();
const cached = async (k, fn) => { if (cache.has(k)) return cache.get(k); const v = await fn(); cache.set(k, v); return v; };

// YouTube Data API (used when a key is set)
const ytApi = async (ep, p) => {
  const u = new URL('https://www.googleapis.com/youtube/v3/' + ep);
  for (const [k, v] of Object.entries({ ...p, key: CONFIG.YOUTUBE_API_KEY })) u.searchParams.set(k, v);
  const r = await fetch(u), j = await r.json();
  if (!r.ok) throw Error(j.error?.message || 'YouTube API error');
  return j;
};
const mapVideo = v => ({ id: v.id, type: 'song', title: cleanTitle(v.snippet.title), artist: cleanArtist(v.snippet.channelTitle), thumb: v.snippet.thumbnails?.medium?.url || '', duration: isoSec(v.contentDetails.duration) });
async function hydrate(items, getId) {
  const ids = items.map(getId).filter(Boolean); if (!ids.length) return [];
  const d = await ytApi('videos', { part: 'contentDetails,snippet', id: ids.join(',') });
  return d.items.map(mapVideo);
}

// Piped (no key)
async function piped(path) {
  for (const b of CONFIG.PIPED) {
    try { const r = await fetch(b + path, { signal: AbortSignal.timeout(7000) }); if (r.ok) return await r.json(); } catch {}
  }
  throw Error('Search servers are unreachable right now. Try again, or set YOUTUBE_API_KEY in CONFIG.');
}
const qp = (u, k) => { try { return new URL(u, 'https://x').searchParams.get(k); } catch { return null; } };
const fromPiped = i => i.type === 'playlist' || /playlist/.test(i.url || '')
  ? { id: qp(i.url, 'list'), type: 'album', title: decode(i.name || i.title), artist: cleanArtist(i.uploaderName), thumb: i.thumbnail, duration: 0 }
  : { id: qp(i.url, 'v'), type: 'song', title: cleanTitle(i.title), artist: cleanArtist(i.uploaderName), thumb: i.thumbnail, duration: i.duration > 0 ? i.duration : 0 };

async function doSearch(q, src, flt) {
  return cached(`s|${src}|${flt}|${q}`, async () => {
    if (CONFIG.YOUTUBE_API_KEY) {
      const p = { part: 'snippet', maxResults: 20, safeSearch: 'moderate' };
      if (flt === 'albums') {
        const d = await ytApi('search', { ...p, q: q + ' album', type: 'playlist' });
        return d.items.map(i => ({ id: i.id.playlistId, type: 'album', title: decode(i.snippet.title), artist: cleanArtist(i.snippet.channelTitle), thumb: i.snippet.thumbnails?.medium?.url || '', duration: 0 }));
      }
      const params = { ...p, type: 'video', q: flt === 'videos' ? q + ' music video' : q };
      if (src === 'ytmusic' && flt === 'songs') params.videoCategoryId = 10;
      return hydrate((await ytApi('search', params)).items, i => i.id.videoId);
    }
    const f = src === 'ytmusic' ? { songs: 'music_songs', videos: 'music_videos', albums: 'music_albums' }[flt] : (flt === 'albums' ? 'playlists' : 'videos');
    const d = await piped(`/search?q=${encodeURIComponent(q)}&filter=${f}`);
    return d.items.map(fromPiped).filter(t => t.id);
  });
}
async function getAlbum(id) {
  return cached('p|' + id, async () => {
    if (CONFIG.YOUTUBE_API_KEY) {
      const d = await ytApi('playlistItems', { part: 'snippet', maxResults: 50, playlistId: id });
      return hydrate(d.items, i => i.snippet.resourceId?.videoId);
    }
    const d = await piped('/playlists/' + id);
    return (d.relatedStreams || []).map(fromPiped).filter(t => t.id);
  });
}
const streamCache = new Map(), relCache = new Map();
async function getStream(id) { // direct audio URL via Piped (cached 30 min); null => YouTube embed fallback
  const c = streamCache.get(id); if (c && Date.now() - c.t < 30 * 60e3) return c.v;
  for (const b of CONFIG.PIPED) {
    try {
      const r = await fetch(`${b}/streams/${id}`, { signal: AbortSignal.timeout(7000) }); if (!r.ok) continue;
      const j = await r.json();
      relCache.set(id, (j.relatedStreams || []).map(fromPiped).filter(x => x.type === 'song' && x.id));
      const a = (j.audioStreams || []).filter(x => x.url && /audio\/(mp4|webm)/.test(x.mimeType || '')).sort((x, y) => (y.bitrate || 0) - (x.bitrate || 0));
      if (a[0]) { const v = { url: a[0].url, kbps: Math.round((a[0].bitrate || 0) / 1000), codec: /mp4/.test(a[0].mimeType) ? 'AAC' : 'Opus' }; streamCache.set(id, { t: Date.now(), v }); return v; }
    } catch {}
  }
  return null;
}
async function getLyrics(t) {
  return cached(`l|${t.artist}|${t.title}`, async () => {
    try {
      let r = await fetch('https://lrclib.net/api/get?' + new URLSearchParams({ track_name: t.title, artist_name: t.artist, duration: t.duration || '' }));
      if (r.ok) return await r.json();
      r = await fetch('https://lrclib.net/api/search?' + new URLSearchParams({ q: `${t.artist} ${t.title}` }));
      const l = r.ok ? await r.json() : [];
      return l.find(x => x.syncedLyrics) || l[0] || null;
    } catch { return null; }
  });
}

/* ============ SMART QUEUE / RECOMMENDATIONS ============ */
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }; // Fisher-Yates
const norm = t => (t.title + t.artist).toLowerCase().replace(/[^a-z0-9]/g, '');
const art = t => `https://i.ytimg.com/vi/${t.id}/hqdefault.jpg`;
async function related(t) {
  if (relCache.has(t.id)) return relCache.get(t.id);
  try { const d = await piped('/streams/' + t.id); const r = (d.relatedStreams || []).map(fromPiped).filter(x => x.type === 'song' && x.id); relCache.set(t.id, r); return r; } catch { return []; }
}
let refilling = null;
const refill = () => refilling || (refilling = (async () => {
  try {
    const cur = S.queue[S.i]; if (!cur) return;
    const seen = new Set([...S.queue.map(t => t.id), ...S.played, ...hist.slice(0, 30).map(t => t.id)]);
    const seenN = new Set(S.queue.map(norm)), perArtist = {};
    const pick = hist.length ? hist[Math.floor(Math.random() * Math.min(hist.length, 10))] : cur; // mixes in a recent taste
    const pool = [...await related(cur)];
    for (const q of [`${cur.artist} mix`, `${pick.artist} songs`]) { if (pool.length >= 20) break; try { pool.push(...await doSearch(q, 'ytmusic', 'songs')); } catch {} }
    const fresh = [];
    for (const t of shuffle(pool)) {
      if (t.type !== 'song' || !t.id || seen.has(t.id) || seenN.has(norm(t)) || t.duration < 60 || t.duration > 720) continue;
      if ((perArtist[t.artist] = (perArtist[t.artist] || 0) + 1) > 3) continue; // keep artists varied
      seen.add(t.id); seenN.add(norm(t)); fresh.push({ ...t, auto: true }); if (fresh.length >= 10) break;
    }
    const start = S.queue.length; S.queue.push(...fresh);
    if (S.shuffle) S.bag = shuffle([...S.bag, ...fresh.map((_, k) => start + k)]);
  } catch {} finally { refilling = null; }
})());

/* ============ LOGO + MEDIA SESSION ============ */

    const g = x.createLinearGradient(0, 0, 512, 512); g.addColorStop(0, '#8b5cf6'); g.addColorStop(1, '#f0abfc');
    x.fillStyle = '#000'; x.fillRect(0, 0, 512, 512); x.fillStyle = g; x.beginPath(); x.roundRect(36, 36, 440, 440, 110); x.fill();
    x.fillStyle = '#000'; x.font = '800 330px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('G', 256, 280);

})();
if (LOGO) for (const rel of ['icon', 'apple-touch-icon']) { const l = document.createElement('link'); l.rel = rel; l.href = LOGO; document.head.appendChild(l); }

}
let lastPos = -1;
function posState(c, d) {

}

const au = new Audio(); au.preload = 'auto'; au.setAttribute('playsinline', ''); au.style.display = 'none'; document.body.appendChild(au); // kept in the DOM + global so the browser never garbage-collects the session
let eng = 'audio', yp = null, ypPromise = null, playId = 0, muted = false;
const setPP = on => { $('#pp').textContent = on ? '❚❚' : '▶'; if (hasMS) navigator.mediaSession.playbackState = on ? 'playing' : 'paused'; };
const ytInit = () => ypPromise || (ypPromise = new Promise(res => {
  window.onYouTubeIframeAPIReady = () => { yp = new YT.Player('yt', { height: '1', width: '1', playerVars: { playsinline: 1, controls: 0 }, events: {
    onReady: () => res(yp),
    onStateChange: e => { if (eng !== 'yt') return; setPP(e.data === 1); if (e.data === 1) yp.setPlaybackRate(+$('#spd').value); if (e.data === 0) next(true); },
    onError: e => { $('#art-n').textContent = `Playback blocked (${e.data}). Host this file on https, e.g. GitHub Pages.`; }
  } }); };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}));
async function ytLoad(id) { await ytInit(); eng = 'yt'; yp.loadVideoById(id); yp.setVolume(+$('#vol').value); muted ? yp.mute() : yp.unMute(); $('#hq').textContent = 'YouTube player'; }
const E = {
  time: () => eng === 'audio' ? au.currentTime : (yp?.getCurrentTime?.() || 0),
  dur: () => eng === 'audio' ? (au.duration || 0) : (yp?.getDuration?.() || 0),
  playing: () => eng === 'audio' ? !au.paused : yp?.getPlayerState?.() === 1,
  pause: () => eng === 'audio' ? au.pause() : yp?.pauseVideo(),
  resume: () => eng === 'audio' ? au.play() : yp?.playVideo(),
  seek: t => eng === 'audio' ? (au.currentTime = t) : yp?.seekTo(t, true)
};
au.onplay = () => eng === 'audio' && setPP(true);
au.onpause = () => {
  if (eng !== 'audio') return; setPP(false);
  // Chrome/Android sometimes pauses audio when the screen locks: resume unless the user paused
  if (!S.userPaused && !S.loading && !au.ended && S.i >= 0 && document.hidden && au.src) setTimeout(() => { if (!S.userPaused && au.paused && !S.loading) au.play().catch(() => {}); }, 300);
};
let stallT;
au.onwaiting = () => { clearTimeout(stallT); stallT = setTimeout(() => { if (eng === 'audio' && !S.userPaused && au.readyState < 3 && au.src) { const t = au.currentTime; au.addEventListener('loadedmetadata', () => { au.currentTime = t; }, { once: true }); au.load(); au.play().catch(() => {}); } }, 10000); };
au.onplaying = () => clearTimeout(stallT);
document.addEventListener('visibilitychange', () => { if (!document.hidden && eng === 'audio' && !S.userPaused && au.paused && S.i >= 0 && !S.loading && au.src && !au.ended) au.play().catch(() => {}); });
au.onended = () => eng === 'audio' && next(true);

function togglePlay(want) { if (S.i < 0) return; const go = want ?? !E.playing(); S.userPaused = !go; go ? E.resume() : E.pause(); }
function playList(list, i) { const t = list[i]; S.queue = list.filter(x => x.type !== 'album'); S.played = new Set(); S.bag = []; S.i = S.queue.findIndex(x => x.id === t.id); play(S.i); }
async function play(i) {
  const t = S.queue[i]; if (!t) return;
  S.i = i; S.played.add(t.id); S.userPaused = false; S.loading = true; const my = ++playId;
  au.pause(); yp?.stopVideo?.(); eng = 'audio'; lastPos = -1;
  $('#ttl').textContent = $('#lt').textContent = t.title; $('#art-n').textContent = $('#la').textContent = t.artist; $('#art').src = t.thumb || art(t);
  $('#lyrBg').style.backgroundImage = `url(${art(t)})`;
  $('#seek').max = t.duration || 100; $('#tot').textContent = fmt(t.duration); $('#hq').textContent = 'Loading…';
  hist = [t, ...hist.filter(x => x.id !== t.id)].slice(0, 50); store.set('gm_history', hist);
  const cn = store.get('gm_counts', {}); cn[t.id] = { t, n: (cn[t.id]?.n || 0) + 1 };
  const ks = Object.keys(cn); if (ks.length > 120) ks.sort((a, b) => cn[a].n - cn[b].n).slice(0, 20).forEach(k => delete cn[k]);
  store.set('gm_counts', cn);
  document.title = `${t.title} · GMUSIC`; setMeta(t);
  $$('.row').forEach(r => r.classList.toggle('cur', S.view[+r.dataset.i]?.id === t.id));
  loadLyrics(t);
  if (S.queue.length - S.i <= 3 && S.repeat !== 2) refill(); // keep autoplay queue fresh
  const s = await getStream(t.id); if (my !== playId) return;
  S.loading = false;
  if (s) {
    au.src = s.url; au.playbackRate = +$('#spd').value; au.volume = +$('#vol').value / 100; au.muted = muted;
    au.play().catch(() => {}); $('#hq').textContent = `${s.kbps} kbps ${s.codec}`;
    const nx = S.queue[S.i + 1]; if (nx && !S.shuffle) getStream(nx.id); // prefetch for seamless background transitions
  } else ytLoad(t.id);
}
async function next(auto) {
  if (!S.queue.length) return;
  if (auto && S.repeat === 1) return play(S.i);
  if (S.shuffle) {
    const pool = () => S.queue.map((x, k) => k).filter(k => k !== S.i && !S.played.has(S.queue[k].id));
    if (!S.bag.length) S.bag = shuffle(pool());
    if (!S.bag.length && S.repeat !== 2) { await refill(); S.bag = shuffle(pool()); }
    if (!S.bag.length && S.repeat === 2) { S.played = new Set([S.queue[S.i].id]); S.bag = shuffle(pool()); }
    return S.bag.length ? play(S.bag.pop()) : (auto ? E.pause() : play(0));
  }
  if (S.i + 1 >= S.queue.length && S.repeat !== 2) await refill();
  if (S.i + 1 < S.queue.length) return play(S.i + 1);
  if (S.repeat === 2 || !auto) return play(0);
  E.pause();
}
const prev = () => { if (!S.queue.length) return; E.time() > 3 ? E.seek(0) : play(S.i > 0 ? S.i - 1 : S.queue.length - 1); };
if (hasMS) {
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };

  h('previoustrack', prev); h('nexttrack', () => next(false));
  h('seekto', d => E.seek(d.seekTime)); h('seekbackward', d => E.seek(Math.max(0, E.time() - (d.seekOffset || 10)))); h('seekforward', d => E.seek(E.time() + (d.seekOffset || 10)));
}

  catch (e) { $(`#sh-${id} .scroll`).innerHTML = `<p class="msg">Couldn't load: ${esc(e.message)}</p>`; }
}
const loadTrend = m => loadShelf('trend', `trend-${m}-${CONFIG.REGION}`, m === 'daily' ? feeds.trendDaily : feeds.trendWeekly, m === 'daily' ? 3 * 36e5 : 12 * 36e5).then(fillQuick);
function fillQuick() {
  const c = store.get('gm_counts', {}), l = Object.values(c).sort((a, b) => b.n - a.n).map(x => x.t);
  hist.forEach(t => { if (!l.some(x => x.id === t.id)) l.push(t); });
  fillShelf('qp', l.length ? l.slice(0, 12) : (S.shelves.trend || []).slice(0, 12));
}
function showHome() {
  $('#res').innerHTML = ''; const h = $('#home'); h.classList.remove('hide');
  if (!h.dataset.built) {
    h.dataset.built = 1;
    h.innerHTML = SHELVES.map(s => `<section class="shelf" id="sh-${s.id}"><div class="shead"><h2>${s.title}</h2>${s.chips ? `<div class="chips">${s.chips.map(([k, l], n) => `<button class="chip${n ? '' : ' on'}" data-tr="${k}">${l}</button>`).join('')}</div>` : ''}</div><div class="scroll ${s.cls || ''}"><p class="msg">Loading…</p></div></section>`).join('');
    loadTrend('daily');
    loadShelf('new', 'new-' + CONFIG.REGION, feeds.releases, 6 * 36e5);
    loadShelf('comm', 'comm-' + CONFIG.REGION, feeds.playlists, 6 * 36e5);
  }
  fillQuick();
}
$('#home').addEventListener('click', e => {
  const chip = e.target.closest('[data-tr]');
  if (chip) { $$('#home .chip').forEach(c => c.classList.toggle('on', c === chip)); return loadTrend(chip.dataset.tr); }
  const c = e.target.closest('.card'); if (!c) return;
  const list = S.shelves[c.dataset.sh], t = list?.[+c.dataset.k]; if (!t) return;
  if (t.type === 'album') return openAlbum(t);
  S.view = list; playList(list, +c.dataset.k);
});
$('#home').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('card')) e.target.click(); });

renderRecent();
</script>
</body>
</html>
